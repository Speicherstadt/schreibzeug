# The documentation as a website: https://schreibzeug.app/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Schreibzeug
site_description: >-
  Schreibzeug, the self-hosted open-source office suite: edit Word, Excel, PowerPoint and PDF files
  together in the browser or as a desktop app, without a document server. An alternative to Microsoft
  365 on your own server.
site_url: https://schreibzeug.app/
repo_url: https://github.com/Speicherstadt/schreibzeug
repo_name: Speicherstadt/schreibzeug
edit_uri: edit/main/docs/
# The German pages have their own (plugins → i18n → languages → de → copyright).
copyright: >-
  License AGPL-3.0 · © Tristan Teufel and contributors · Schreibzeug builds on the open-source
  Euro-Office engine and is not affiliated with Euro-Office, ONLYOFFICE, Microsoft or Google.
  · <a href="https://teufel-it.de/de/impressum/">Legal notice</a>
  · <a href="https://speicherstadt.app/en/privacy/">Privacy</a>

docs_dir: docs
# Pages as installation.html rather than installation/: the README links to them so, and relative
# image paths stay the same as on GitHub.
use_directory_urls: false

nav:
  - Home: index.md
  - Overview: overview.md
  - Running it:
      - Installation: installation.md
      - Accounts and sharing: accounts.md
      - Sign-in through Kontext: kontext.md
      - Desktop app: desktop.md
      - Hosted or with a partner: hosted.md
  - Working with it:
      - Files and versions: files.md
      - Collaboration: collaboration.md
      - PDFs: pdf.md
      - Markdown and text files: text.md
      - E-invoices: e-invoice.md
      - MCP server (AI assistants): mcp.md
      - Accessibility: accessibility.md
  - Behind it:
      - Architecture: architecture.md
      - The editing engine: engine.md
      - Development: development.md

theme:
  name: material
  # Link previews for pages with an image (overrides/main.html)
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Fonts (Google Fonts) and other external assets are downloaded at build time and served from
  # this site, so a reader's browser contacts no third party. Cache in .cache/ (git-ignored).
  - privacy
  # English at /, German at /de/. Every page has its translation next to it with .de.md
  # (index.de.md), headings with the same anchor ids. A first visit opens the browser's language
  # (overrides/partials/language-redirect.html).
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: de
          name: Deutsch
          copyright: >-
            Lizenz AGPL-3.0 · © Tristan Teufel und Mitwirkende · Schreibzeug baut auf der
            Open-Source-Engine Euro-Office auf und steht in keiner Verbindung zu Euro-Office,
            ONLYOFFICE, Microsoft oder Google.
            · <a href="https://teufel-it.de/de/impressum/">Impressum</a>
            · <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>
          site_description: >-
            Schreibzeug, das selbst gehostete Open-Source-Office: Word-, Excel-, PowerPoint- und
            PDF-Dateien gemeinsam im Browser oder als Desktop-App bearbeiten, ohne
            Dokumentenserver. Eine Alternative zu Microsoft 365 auf dem eigenen
            Server.
          nav_translations:
            Home: Start
            Overview: Überblick
            Running it: Betrieb
            Accounts and sharing: Konten und Teilen
            Sign-in through Kontext: Anmeldung über Kontext
            Desktop app: Desktop-App
            Hosted or with a partner: Gehostet oder mit Partner
            Working with it: Arbeiten damit
            Files and versions: Dateien und Versionen
            Collaboration: Zusammenarbeit
            Markdown and text files: Markdown und Textdateien
            E-invoices: E-Rechnungen
            MCP server (AI assistants): MCP-Server (KI-Assistenten)
            Behind it: Technik
            Architecture: Architektur
            The editing engine: Die Engine
            Development: Entwicklung

extra_css:
  - assets/entdecken.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
