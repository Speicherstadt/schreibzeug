# The documentation as a website: https://schreibzeug.app/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: pip install -r requirements-docs.txt && mkdocs serve
site_name: Schreibzeug
site_description: >-
  Schreibzeug, das selbst gehostete Open-Source-Office: Word-, Excel-, PowerPoint- und PDF-Dateien
  gemeinsam im Browser oder als Desktop-App bearbeiten, ohne Dokumentenserver. Eine Alternative zu
  Microsoft 365 auf dem eigenen Server.
site_url: https://schreibzeug.app/
repo_url: https://github.com/Speicherstadt/schreibzeug
repo_name: Speicherstadt/schreibzeug
edit_uri: edit/main/docs/
copyright: >-
  Lizenz AGPL-3.0 · © Tristan Teufel und Mitwirkende · Schreibzeug baut auf der Open-Source-Engine
  Euro-Office auf und steht in keiner Verbindung zu Euro-Office, ONLYOFFICE, Microsoft oder Google.
  · <a href="https://teufel-it.de/de/impressum/">Impressum</a>
  · <a href="https://speicherstadt.app/datenschutz/">Datenschutz</a>

docs_dir: docs
# Pages as installation.html rather than installation/: the README links to them so, and relative
# image paths stay the same as on GitHub.
use_directory_urls: false

nav:
  - Start: index.md
  - Überblick: overview.md
  - Betrieb:
      - Installation: installation.md
      - Konten und Teilen: accounts.md
      - Anmeldung über Kontext: kontext.md
      - Desktop-App: desktop.md
      - Gehostet oder mit Partner: hosted.md
  - Arbeiten damit:
      - Dateien und Versionen: files.md
      - Zusammenarbeit: collaboration.md
      - PDFs: pdf.md
      - Markdown und Textdateien: text.md
      - E-Rechnungen: e-invoice.md
      - MCP-Server (KI-Assistenten): mcp.md
      - Barrierefreiheit: accessibility.md
  - Technik:
      - Architektur: architecture.md
      - Die Engine: engine.md
      - Entwicklung: development.md

theme:
  name: material
  # Link previews for pages with an image (overrides/main.html)
  custom_dir: overrides
  language: de
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: Helles Design
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Fonts (Google Fonts) and other external assets are downloaded at build time and served from
  # this site, so a reader's browser contacts no third party. Cache in .cache/ (git-ignored).
  - privacy
  # The documentation was English at / and German at /de/ until it became German only; links
  # already shared to /de/ and to the old German tour (entdecken.html) keep working.
  - redirects:
      redirect_maps:
        entdecken.md: index.md
        de/entdecken.md: index.md
        de/index.md: index.md
        de/overview.md: overview.md
        de/installation.md: installation.md
        de/accounts.md: accounts.md
        de/kontext.md: kontext.md
        de/desktop.md: desktop.md
        de/hosted.md: hosted.md
        de/files.md: files.md
        de/collaboration.md: collaboration.md
        de/pdf.md: pdf.md
        de/text.md: text.md
        de/e-invoice.md: e-invoice.md
        de/mcp.md: mcp.md
        de/accessibility.md: accessibility.md
        de/architecture.md: architecture.md
        de/engine.md: engine.md
        de/development.md: development.md

extra_css:
  - assets/entdecken.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
